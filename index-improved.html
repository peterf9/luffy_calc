<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pet - UI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; transition: background-color 0.5s;
        }
        .card {
            background: white; padding: 1.5rem; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px;
            text-align: center; border-top: 6px solid #d32f2f; position: relative;
        }
        body.feeding-time { background-color: #e8f5e9; }
        body.feeding-time .card { border-top-color: #2e7d32; box-shadow: 0 0 30px rgba(76, 175, 80, 0.4); }
        
        h1 { color: #333; margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        h4 { color: #666; font-weight: normal; margin-top: 5px; margin-bottom: 15px; font-size: 0.9rem; }
        
        .gami-header {
            display: flex; justify-content: space-around; background: #fff8e1;
            padding: 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffecb3;
            font-weight: bold; color: #f57c00; font-size: 0.95rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .gami-item { display: flex; align-items: center; gap: 5px; }

        .info-row {
            display: flex; justify-content: space-between; margin-bottom: 10px;
            font-size: 0.9rem; color: #555; background: #f8f9fa;
            padding: 10px; border-radius: 10px; border: 1px solid #eee;
        }
        
        .section-title {
            text-align: left; margin-bottom: 5px; font-size: 0.85rem; font-weight: bold; color: #444; margin-top: 20px; border-bottom: 2px solid #eee; padding-bottom: 3px;
        }

        .meal-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 6px 12px; border: 1px solid #ddd;
            border-radius: 12px; transition: all 0.3s ease; margin-bottom: 8px;
        }
        .meal-row.fed { 
            background-color: #dcedc8; 
            border-color: #8bc34a; 
            border-left: 4px solid #4caf50;
            opacity: 1;
        }
        
        .time-wrapper {
            display: flex; 
            align-items: center; 
            justify-content: flex-end; 
            flex-grow: 1; 
            padding-right: 5px;
        }

        .meal-row.fed input[type="time"] { 
            display: none;
        }
        
        .completed-label { 
            display: none; 
            font-size: 0.95rem; 
            white-space: nowrap; 
        }
        
        .meal-row.fed .completed-label { display: block; }

        .time-label { font-size: 0.85rem; font-weight: bold; color: #555; width: 100px; text-align: left; }
        
        input[type="time"] {
            font-family: 'Segoe UI', sans-serif; font-size: 1.1rem; padding: 4px;
            border: 1px solid #eee; border-radius: 6px; background: #f9f9f9; color: #333;
            width: 90px; text-align: center; font-weight: bold; outline: none; transition: all 0.3s;
        }
        
        input[type="time"]:focus {
            border-color: #2e7d32;
            background: #fff;
        }
        
        .check-btn { 
            width: 24px; 
            height: 24px; 
            cursor: pointer; 
            accent-color: #2e7d32; 
            transform: scale(1.2); 
            margin-left: 5px;
            appearance: none;
            -webkit-appearance: none;
        }
        
        .status-bar {
            margin-top: 15px; padding: 10px; background: #333; color: white;
            border-radius: 8px; font-size: 0.9rem; font-weight: bold; min-height: 20px;
        }
        
        .status-bar.error {
            background-color: #c62828;
        }
        
        .status-bar.success {
            background-color: #2e7d32;
        }
        
        #debugPanel { 
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #666;
            max-height: 100px;
            overflow-y: auto;
        }
        
        .sync-status {
            font-size: 0.7rem; 
            color: #ccc; 
            margin-top: 10px;
            min-height: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="petName">Buscando... 🐾</h1>
        <h4 style="margin-bottom: 10px;">Painel da Família</h4>

        <div class="gami-header">
            <div class="gami-item">🌟 Lvl <span id="lvlDisplay" aria-label="Nível">--</span></div>
            <div class="gami-item">✨ <span id="xpDisplay" aria-label="Pontos de experiência">--</span> XP</div>
            <div class="gami-item">🪙 <span id="coinDisplay" aria-label="Moedas">--</span></div>
        </div>

        <div class="info-row">
            <span>Idade:</span> <strong id="idadeDisplay">--</strong>
        </div>
        <div class="info-row" style="margin-top:-5px;">
            <span>Meta Hoje:</span> <strong id="totalGrams">-- g</strong>
        </div>
        
        <div class="section-title">🍖 Refeições</div>
        <div id="clockContainer"></div>

        <div class="section-title">🎯 Missões Diárias</div>
        <div id="tasksContainer">
            <div class="meal-row" id="row-walk">
                <div class="time-label">🦮 Passeio</div>
                <input type="checkbox" id="check-walk" class="check-btn" aria-label="Passeio concluído">
            </div>
            <div class="meal-row" id="row-water">
                <div class="time-label">💧 Água Fresca</div>
                <input type="checkbox" id="check-water" class="check-btn" aria-label="Água fresca fornecida">
            </div>
        </div>

        <div id="statusBar" class="status-bar">Conectando à nuvem...</div>
        <div class="sync-status" id="syncStatus"></div>
        <div id="debugPanel"></div>
    </div>

    <script>
        const PANTRY_ID = "c42cdca2-f5c9-4b78-b7ba-527236418398"; 
        const BASKET_NAME = "bello_app_state"; 
        const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;
        const SYNC_DEBOUNCE_MS = 1000;
        const CLOUD_POLL_MS = 5000;

        let fullCloudData = {}; 
        let activePetId = "";
        let syncTimeoutId = null;
        let lastSyncTime = 0;
        let isOnline = navigator.onLine;

        const DICIONARIO = {
            "Breakfast": "Café da Manhã",
            "Lunch": "Almoço",
            "Dinner": "Jantar"
        };

        // Utility: Debounce
        const debounce = (func, delay) => {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func.apply(this, args), delay);
            };
        };

        // Utility: Safe date parsing
        function parseDateString(dateStr) {
            if (!dateStr || !dateStr.includes("-")) return null;
            try {
                const [year, month, day] = dateStr.split("-").map(Number);
                if (year < 1900 || year > 2100 || month < 1 || month > 12 || day < 1 || day > 31) {
                    throw new Error("Invalid date");
                }
                return new Date(year, month - 1, day);
            } catch (e) {
                console.warn("Date parsing failed:", dateStr, e);
                return null;
            }
        }

        // Utility: Safe time validation
        function isValidTime(timeStr) {
            const regex = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/;
            return regex.test(timeStr);
        }

        // Update status bar
        function updateStatusBar(message, type = "default") {
            const bar = document.getElementById('statusBar');
            bar.innerText = message;
            bar.className = `status-bar ${type}`;
        }

        // Update sync status
        function updateSyncStatus(message) {
            const syncEl = document.getElementById('syncStatus');
            syncEl.innerText = message;
            if (message) {
                setTimeout(() => { syncEl.innerText = ""; }, 3000);
            }
        }

        function getDataLocal() {
            const d = new Date();
            return d.getFullYear() + '-' + 
                   String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(d.getDate()).padStart(2, '0');
        }

        window.onload = () => {
            carregarDaNuvem();
            setInterval(carregarDaNuvem, CLOUD_POLL_MS);
            setInterval(verificarStatusVisual, 60000);
            
            // Monitor online/offline status
            window.addEventListener('online', () => {
                isOnline = true;
                updateSyncStatus("📡 Reconectado");
            });
            window.addEventListener('offline', () => {
                isOnline = false;
                updateStatusBar("⚠️ Sem conexão", "error");
            });
        };

        async function carregarDaNuvem() {
            try {
                const urlSemCache = API_URL + "?t=" + new Date().getTime();
                const response = await fetch(urlSemCache, { cache: "no-store", timeout: 5000 });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Validate response structure
                if (!data || typeof data !== 'object') {
                    throw new Error("Invalid response format");
                }
                
                fullCloudData = data;
                activePetId = data.activePetId;
                const pet = data.pets?.[activePetId];
                
                if (pet) {
                    aplicarDados(pet);
                } else {
                    console.warn("No active pet found");
                    updateStatusBar("⚠️ Nenhum pet ativo", "error");
                }
            } catch (err) { 
                console.error("Falha ao carregar dados:", err);
                updateStatusBar("❌ Erro ao sincronizar", "error");
            }
        }

        function aplicarDados(pet) {
            // Safe pet name extraction
            const petName = pet?.petInfo?.name || "Pet";
            const petNameSafe = String(petName).replace(/[<>]/g, ''); // Sanitize
            document.getElementById('petName').innerText = `${petNameSafe} Family 🐾`;
            
            // Validate and display grams
            const totalGrams = Number(pet?.schedule?.totalGrams) || 0;
            const gramsPerMeal = Number(pet?.schedule?.gramsPerMeal) || 0;
            document.getElementById('totalGrams').innerText = `${totalGrams} g (~${gramsPerMeal}g/pote)`;
            
            const gami = pet?.gamification || {};
            document.getElementById('lvlDisplay').innerText = Math.max(1, Number(gami.level) || 1);
            document.getElementById('xpDisplay').innerText = Math.max(0, Number(gami.xp) || 0);
            document.getElementById('coinDisplay').innerText = Math.max(0, Number(gami.patacoins) || 0);

            // Update daily tasks
            const tasks = gami.dailyTasks || {};
            ['walk', 'water'].forEach(task => {
                const checkEl = document.getElementById(`check-${task}`);
                const rowEl = document.getElementById(`row-${task}`);
                if (checkEl) {
                    checkEl.checked = Boolean(tasks[task]);
                    if (tasks[task]) rowEl.classList.add('fed'); 
                    else rowEl.classList.remove('fed');
                }
            });
            
            // Age calculation with error handling
            const dataNascimentoString = pet?.petInfo?.birthDate;
            if (dataNascimentoString) {
                const birth = parseDateString(dataNascimentoString);
                if (birth) {
                    const hoje = new Date();
                    let meses = (hoje.getFullYear() - birth.getFullYear()) * 12 + (hoje.getMonth() - birth.getMonth());
                    let dias = hoje.getDate() - birth.getDate();
                    if (dias < 0) { meses--; dias += 30; }
                    document.getElementById('idadeDisplay').innerText = `${meses} meses, ${dias} dias`;
                }
            }

            const dataHoje = getDataLocal();
            const logHoje = Array.isArray(pet?.logs?.[dataHoje]) ? pet.logs[dataHoje] : [];
            const meals = Array.isArray(pet?.schedule?.meals) ? pet.schedule.meals : [];

            const container = document.getElementById('clockContainer');

            // Rebuild meal rows if count differs
            if (container.children.length !== meals.length) {
                container.innerHTML = "";
                meals.forEach(meal => {
                    // Validate meal data
                    const mealId = String(meal.id || '').trim();
                    const mealName = String(meal.name || 'Refeição').replace(/[<>]/g, '');
                    const mealTime = isValidTime(meal.time) ? meal.time : '00:00';
                    const mealGrams = Math.max(0, Number(meal.grams) || 0);
                    
                    if (!mealId) return; // Skip if no valid ID

                    let row = document.createElement('div');
                    row.className = 'meal-row';
                    row.id = `row-${mealId}`;
                    
                    const nomeTraduzido = DICIONARIO[mealName] || mealName;

                    row.innerHTML = `
                        <div class="time-label">${nomeTraduzido} <br><small style="font-size:0.65rem; color:#999;">${mealGrams}g</small></div>
                        <div class="time-wrapper">
                            <input type="time" id="time-${mealId}" value="${mealTime}" aria-label="Horário de ${nomeTraduzido}">
                            <span id="completed-time-${mealId}" class="completed-label"></span>
                        </div>
                        <input type="checkbox" id="check-${mealId}" class="check-btn" aria-label="Refeição ${nomeTraduzido} concluída">
                    `;
                    container.appendChild(row);
                    
                    // Add event listener (without inline handlers)
                    const timeInput = row.querySelector('input[type="time"]');
                    const checkInput = row.querySelector('input[type="checkbox"]');
                    
                    timeInput.addEventListener('change', () => salvarRefeicao(mealId));
                    checkInput.addEventListener('change', () => salvarRefeicao(mealId));
                });
            }

            // Update meal states
            meals.forEach(meal => {
                const mealId = String(meal.id || '').trim();
                if (!mealId) return;
                
                const inputTime = document.getElementById(`time-${mealId}`);
                const inputCheck = document.getElementById(`check-${mealId}`);
                const row = document.getElementById(`row-${mealId}`);
                const completedSpan = document.getElementById(`completed-time-${mealId}`);

                if (inputTime && document.activeElement !== inputTime) {
                    inputTime.value = isValidTime(meal.time) ? meal.time : '00:00';
                }
                
                const logEntry = logHoje.find(log => log.id === mealId);
                const isChecked = !!logEntry;
                
                if (inputCheck) inputCheck.checked = isChecked;
                
                if (isChecked) {
                    row.classList.add('fed');
                    if (completedSpan) {
                        completedSpan.innerHTML = '';
                        const strikeSpan = document.createElement('s');
                        strikeSpan.style.color = '#9e9e9e';
                        strikeSpan.textContent = meal.time;
                        
                        const checkSpan = document.createElement('span');
                        checkSpan.style.color = '#2e7d32';
                        checkSpan.style.fontWeight = 'bold';
                        checkSpan.textContent = `✅ ${String(logEntry.completedAt || '').substring(0, 5)}`;
                        
                        completedSpan.appendChild(strikeSpan);
                        completedSpan.appendChild(document.createTextNode(' '));
                        completedSpan.appendChild(checkSpan);
                    }
                } else {
                    row.classList.remove('fed');
                }
            });

            verificarStatusVisual();
        }

        async function salvarRefeicao(mealId) {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;
            
            const dataHoje = getDataLocal();
            if (!pet.logs) pet.logs = {};
            if (!Array.isArray(pet.logs[dataHoje])) pet.logs[dataHoje] = [];
            let logArray = pet.logs[dataHoje];

            const inputTime = document.getElementById(`time-${mealId}`);
            const inputCheck = document.getElementById(`check-${mealId}`);
            
            if (!inputTime || !inputCheck) return;
            
            const timeValue = inputTime.value;
            if (!isValidTime(timeValue)) {
                console.warn("Invalid time:", timeValue);
                return;
            }
            
            const isChecked = inputCheck.checked;

            const mealObj = pet?.schedule?.meals?.find(m => String(m.id) === String(mealId));
            if (mealObj) mealObj.time = timeValue;

            const logIndex = logArray.findIndex(l => String(l.id) === String(mealId));

            if (isChecked && logIndex === -1) {
                const agora = new Date();
                const horaConclusao = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
                logArray.push({ id: mealId, completedAt: horaConclusao });
            } else if (!isChecked && logIndex !== -1) {
                logArray.splice(logIndex, 1);
            }

            aplicarDados(pet);
            debouncedSync();
        }

        // Add event listeners for tasks (not inline handlers)
        document.getElementById('check-walk')?.addEventListener('change', () => salvarTarefa('walk'));
        document.getElementById('check-water')?.addEventListener('change', () => salvarTarefa('water'));

        async function salvarTarefa(taskId) {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;

            if (!pet.gamification) pet.gamification = {};
            if (!pet.gamification.dailyTasks) pet.gamification.dailyTasks = {};

            const isChecked = document.getElementById(`check-${taskId}`)?.checked;
            pet.gamification.dailyTasks[taskId] = Boolean(isChecked);

            debouncedSync();
        }

        const debouncedSync = debounce(sincronizarComBackend, SYNC_DEBOUNCE_MS);

        async function sincronizarComBackend() {
            if (!isOnline) {
                updateSyncStatus("⚠️ Sem conexão - salvo localmente");
                return;
            }
            
            if (Date.now() - lastSyncTime < SYNC_DEBOUNCE_MS) {
                return; // Skip if synced recently
            }
            
            updateSyncStatus("Sincronizando...");
            
            fullCloudData.lastUpdatedAt = new Date().getTime();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fullCloudData),
                    timeout: 5000
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                lastSyncTime = Date.now();
                updateSyncStatus("✅ Sincronizado!");
            } catch (err) { 
                console.error("Sync error:", err);
                updateSyncStatus("⚠️ Offline - será sincronizado depois");
            }
        }

        function verificarStatusVisual() {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;

            const agora = new Date();
            const minAgora = (agora.getHours() * 60) + agora.getMinutes();
            const dataHoje = getDataLocal();
            const logHoje = Array.isArray(pet?.logs?.[dataHoje]) ? pet.logs[dataHoje] : [];
            const meals = Array.isArray(pet?.schedule?.meals) ? pet.schedule.meals : [];
            
            let proxima = null;
            let metaAtingida = true;

            meals.forEach(meal => {
                const isChecked = logHoje.some(l => String(l.id) === String(meal.id));
                if (!isChecked) {
                    metaAtingida = false;
                    const timeStr = meal.time || "00:00";
                    if (isValidTime(timeStr)) {
                        const [h, m] = timeStr.split(':').map(Number);
                        const minMeal = (h * 60) + m;
                        if (!proxima && minAgora < minMeal + 60) proxima = meal;
                    }
                }
            });

            if (metaAtingida) {
                updateStatusBar("✅ Rotina concluída!", "success");
            } else if (proxima) {
                const timeStr = proxima.time || "00:00";
                if (isValidTime(timeStr)) {
                    const [h, m] = timeStr.split(':').map(Number);
                    const minMeal = (h * 60) + m;
                    const nomeTraduzido = DICIONARIO[proxima.name] || proxima.name;
                    
                    if (minAgora >= minMeal - 15 && minAgora <= minMeal + 30) {
                        document.body.classList.add('feeding-time');
                        updateStatusBar(`🍖 HORA DE COMER! (${proxima.time})`, "default");
                    } else {
                        document.body.classList.remove('feeding-time');
                        updateStatusBar(`⏳ Próxima: ${nomeTraduzido} às ${proxima.time}`, "default");
                    }
                }
            } else {
                document.body.classList.remove('feeding-time');
                updateStatusBar("⏳ Aguardando próxima refeição", "default");
            }
        }
    </script>
</body>
</html>
