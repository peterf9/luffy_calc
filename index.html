<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pet - UI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; margin: 0; transition: background-color 0.5s;
        }
        .card {
            background: white; padding: 1.5rem; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px;
            text-align: center; border-top: 6px solid #d32f2f; position: relative;
        }
        body.feeding-time { background-color: #e8f5e9; }
        body.feeding-time .card { border-top-color: #2e7d32; box-shadow: 0 0 30px rgba(76, 175, 80, 0.4); }
        
        h1 { color: #333; margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        h4 { color: #666; font-weight: normal; margin-top: 5px; margin-bottom: 15px; font-size: 0.9rem; }
        
        .gami-header {
            display: flex; justify-content: space-around; background: #fff8e1;
            padding: 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffecb3;
            font-weight: bold; color: #f57c00; font-size: 0.95rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .gami-item { display: flex; align-items: center; gap: 5px; }

        .info-row {
            display: flex; justify-content: space-between; margin-bottom: 10px;
            font-size: 0.9rem; color: #555; background: #f8f9fa;
            padding: 10px; border-radius: 10px; border: 1px solid #eee;
        }
        
        .section-title {
            text-align: left; margin-bottom: 5px; font-size: 0.85rem; font-weight: bold; color: #444; margin-top: 20px; border-bottom: 2px solid #eee; padding-bottom: 3px;
        }

        .meal-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 6px 12px; border: 1px solid #ddd;
            border-radius: 12px; transition: all 0.3s ease; margin-bottom: 8px;
        }
        .meal-row.fed { background-color: #dcedc8; border-color: #8bc34a; opacity: 0.8; }
        
        /* Ajuste Físico para evitar sobreposição */
        .time-wrapper {
            display: flex; 
            align-items: center; 
            justify-content: flex-end; 
            flex-grow: 1; 
            gap: 15px; /* Força espaço entre os horários */
            padding-right: 10px;
        }

        .meal-row.fed input[type="time"] { 
            text-decoration: line-through; 
            color: #9e9e9e; 
            background-color: transparent; 
            border: none; 
            width: 50px; /* Reduz drasticamente a "caixa" do input mobile */
            padding: 0;
            margin: 0;
            pointer-events: none; 
        }
        
        .completed-label { 
            display: none; 
            color: #2e7d32; 
            font-weight: bold; 
            font-size: 0.95rem; 
            white-space: nowrap; 
        }
        .meal-row.fed .completed-label { display: inline; }

        .time-label { font-size: 0.85rem; font-weight: bold; color: #555; width: 90px; text-align: left; }
        
        input[type="time"] {
            font-family: 'Segoe UI', sans-serif; font-size: 1.1rem; padding: 4px;
            border: 1px solid #eee; border-radius: 6px; background: #f9f9f9; color: #333;
            width: 90px; text-align: center; font-weight: bold; outline: none; transition: all 0.3s;
        }
        .check-btn { width: 24px; height: 24px; cursor: pointer; accent-color: #2e7d32; transform: scale(1.2); margin-left: 5px; }
        
        .status-bar {
            margin-top: 15px; padding: 10px; background: #333; color: white;
            border-radius: 8px; font-size: 0.9rem; font-weight: bold; min-height: 20px;
        }
        #debugPanel { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="petName">Buscando... 🐾</h1>
        <h4 style="margin-bottom: 10px;">Painel da Família</h4>

        <div class="gami-header">
            <div class="gami-item">🌟 Lvl <span id="lvlDisplay">--</span></div>
            <div class="gami-item">✨ <span id="xpDisplay">--</span> XP</div>
            <div class="gami-item">🪙 <span id="coinDisplay">--</span></div>
        </div>

        <div class="info-row">
            <span>Idade:</span> <strong id="idadeDisplay">--</strong>
        </div>
        <div class="info-row" style="margin-top:-5px;">
            <span>Meta Hoje:</span> <strong id="totalGrams">-- g</strong>
        </div>
        
        <div class="section-title">🍖 Refeições</div>
        <div id="clockContainer"></div>

        <div class="section-title">🎯 Missões Diárias</div>
        <div id="tasksContainer">
            <div class="meal-row" id="row-walk">
                <div class="time-label">🦮 Passeio</div>
                <input type="checkbox" id="check-walk" class="check-btn" onchange="salvarTarefa('walk')">
            </div>
            <div class="meal-row" id="row-water">
                <div class="time-label">💧 Água Fresca</div>
                <input type="checkbox" id="check-water" class="check-btn" onchange="salvarTarefa('water')">
            </div>
        </div>

        <div id="statusBar" class="status-bar">Conectando à nuvem...</div>
        <div id="syncStatus" style="font-size: 0.7rem; color: #ccc; margin-top: 10px;"></div>
        <div id="debugPanel"></div>
    </div>

    <script>
        const PANTRY_ID = "c42cdca2-f5c9-4b78-b7ba-527236418398"; 
        const BASKET_NAME = "bello_app_state"; 
        const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

        let fullCloudData = {}; 
        let activePetId = "";

        function getDataLocal() {
            const d = new Date();
            return d.getFullYear() + '-' + 
                   String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(d.getDate()).padStart(2, '0');
        }

        window.onload = () => {
            carregarDaNuvem();
            setInterval(carregarDaNuvem, 5000);
            setInterval(verificarStatusVisual, 60000);
        };

        async function carregarDaNuvem() {
            try {
                const urlSemCache = API_URL + "?t=" + new Date().getTime();
                const response = await fetch(urlSemCache, { cache: "no-store" });
                const data = await response.json();
                
                fullCloudData = data;
                activePetId = data.activePetId;
                const pet = data.pets?.[activePetId];
                
                if (pet) aplicarDados(pet);
            } catch (err) { console.error("Falha na nuvem", err); }
        }

        function aplicarDados(pet) {
            document.getElementById('petName').innerText = `${pet?.petInfo?.name || "Pet"} Family 🐾`;
            document.getElementById('totalGrams').innerText = `${pet?.schedule?.totalGrams || 0} g (~${pet?.schedule?.gramsPerMeal || 0}g/pote)`;
            
            const gami = pet?.gamification || {};
            document.getElementById('lvlDisplay').innerText = gami.level || 1;
            document.getElementById('xpDisplay').innerText = gami.xp || 0;
            document.getElementById('coinDisplay').innerText = gami.patacoins || 0;

            const tasks = gami.dailyTasks || {};
            ['walk', 'water'].forEach(task => {
                const checkEl = document.getElementById(`check-${task}`);
                const rowEl = document.getElementById(`row-${task}`);
                if (checkEl) {
                    checkEl.checked = tasks[task] || false;
                    if (tasks[task]) rowEl.classList.add('fed'); else rowEl.classList.remove('fed');
                }
            });
            
            const dataNascimentoString = pet?.petInfo?.birthDate; 
            if (dataNascimentoString && dataNascimentoString.includes("-")) {
                const partes = dataNascimentoString.split("-");
                const birth = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                const hoje = new Date();
                let meses = (hoje.getFullYear() - birth.getFullYear()) * 12 + (hoje.getMonth() - birth.getMonth());
                let dias = hoje.getDate() - birth.getDate();
                if (dias < 0) { meses--; dias += 30; }
                document.getElementById('idadeDisplay').innerText = `${meses} meses, ${dias} dias`;
            }

            const dataHoje = getDataLocal();
            const logHoje = Array.isArray(pet?.logs?.[dataHoje]) ? pet.logs[dataHoje] : [];
            const meals = pet?.schedule?.meals || [];

            const container = document.getElementById('clockContainer');

            if (container.children.length !== meals.length) {
                container.innerHTML = "";
                meals.forEach(meal => {
                    let row = document.createElement('div');
                    row.className = 'meal-row';
                    row.id = `row-${meal.id}`;
                    
                    row.innerHTML = `
                        <div class="time-label">${meal.name || 'Refeição'} <br><small style="font-size:0.65rem; color:#999;">${meal.grams || 0}g</small></div>
                        <div class="time-wrapper">
                            <input type="time" id="time-${meal.id}" value="${meal.time || '00:00'}" onchange="salvarRefeicao('${meal.id}')">
                            <span id="completed-time-${meal.id}" class="completed-label"></span>
                        </div>
                        <input type="checkbox" id="check-${meal.id}" class="check-btn" onchange="salvarRefeicao('${meal.id}')">
                    `;
                    container.appendChild(row);
                });
            }

            meals.forEach(meal => {
                const inputTime = document.getElementById(`time-${meal.id}`);
                const inputCheck = document.getElementById(`check-${meal.id}`);
                const row = document.getElementById(`row-${meal.id}`);
                const completedSpan = document.getElementById(`completed-time-${meal.id}`);

                if (inputTime && document.activeElement !== inputTime) inputTime.value = meal.time || '00:00';
                
                const logEntry = logHoje.find(log => log.id === meal.id);
                const isChecked = !!logEntry;
                
                if (inputCheck) inputCheck.checked = isChecked;
                if (isChecked) {
                    row.classList.add('fed');
                    if(completedSpan) completedSpan.innerText = `✅ ${logEntry.completedAt}`;
                } else {
                    row.classList.remove('fed');
                }
            });

            verificarStatusVisual();
        }

        async function salvarRefeicao(mealId) {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;
            
            const dataHoje = getDataLocal();
            if (!pet.logs) pet.logs = {};
            if (!Array.isArray(pet.logs[dataHoje])) pet.logs[dataHoje] = [];
            let logArray = pet.logs[dataHoje];

            const inputTime = document.getElementById(`time-${mealId}`).value;
            const isChecked = document.getElementById(`check-${mealId}`).checked;

            const mealObj = pet?.schedule?.meals?.find(m => m.id === mealId);
            if (mealObj) mealObj.time = inputTime;

            const logIndex = logArray.findIndex(l => l.id === mealId);

            if (isChecked && logIndex === -1) {
                const agora = new Date();
                const horaConclusao = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
                logArray.push({ id: mealId, completedAt: horaConclusao });
            } else if (!isChecked && logIndex !== -1) {
                logArray.splice(logIndex, 1);
            }

            aplicarDados(pet);
            sincronizarComBackend();
        }

        async function salvarTarefa(taskId) {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;

            if (!pet.gamification) pet.gamification = {};
            if (!pet.gamification.dailyTasks) pet.gamification.dailyTasks = {};

            const isChecked = document.getElementById(`check-${taskId}`).checked;
            pet.gamification.dailyTasks[taskId] = isChecked;

            sincronizarComBackend();
        }

        async function sincronizarComBackend() {
            document.getElementById('syncStatus').innerText = "Sincronizando...";
            
            fullCloudData.lastUpdatedAt = new Date().getTime();

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(fullCloudData)
                });
                document.getElementById('syncStatus').innerText = "Sincronizado! 🚀";
                setTimeout(() => { document.getElementById('syncStatus').innerText = ""; }, 2000);
            } catch (err) { document.getElementById('syncStatus').innerText = "Offline"; }
        }

        function verificarStatusVisual() {
            const pet = fullCloudData?.pets?.[activePetId];
            if (!pet) return;

            const agora = new Date();
            const minAgora = (agora.getHours() * 60) + agora.getMinutes();
            const dataHoje = getDataLocal();
            const logHoje = Array.isArray(pet?.logs?.[dataHoje]) ? pet.logs[dataHoje] : [];
            const meals = pet?.schedule?.meals || [];
            
            let proxima = null;
            let metaAtingida = true;

            meals.forEach(meal => {
                const isChecked = logHoje.some(l => l.id === meal.id);
                if (!isChecked) {
                    metaAtingida = false;
                    const [h, m] = (meal.time || "00:00").split(':').map(Number);
                    const minMeal = (h * 60) + m;
                    if (!proxima && minAgora < minMeal + 60) proxima = meal;
                }
            });

            const bar = document.getElementById('statusBar');
            if (metaAtingida) {
                document.body.classList.remove('feeding-time');
                bar.innerText = "✅ Rotina concluída!";
            } else if (proxima) {
                const [h, m] = proxima.time.split(':').map(Number);
                const minMeal = (h * 60) + m;
                if (minAgora >= minMeal - 15 && minAgora <= minMeal + 30) {
                    document.body.classList.add('feeding-time');
                    bar.innerText = `🍖 HORA DE COMER! (${proxima.time})`;
                } else {
                    document.body.classList.remove('feeding-time');
                    bar.innerText = `⏳ Próxima: ${proxima.name} às ${proxima.time}`;
                }
            }
        }
    </script>
</body>
</html>
