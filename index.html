<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luffy Safety App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #d32f2f;
            position: relative;
        }
        
        /* Estado de Alerta */
        body.feeding-time { background-color: #e8f5e9; }
        body.feeding-time .card { border-top-color: #2e7d32; box-shadow: 0 0 30px rgba(76, 175, 80, 0.4); }

        h1 { color: #333; margin: 0; font-size: 1.5rem; letter-spacing: -0.5px; }
        h4 { color: #666; font-weight: normal; margin-top: 5px; margin-bottom: 20px; font-size: 0.9rem; }
        
        .info-row {
            display: flex; justify-content: space-between; margin-bottom: 10px;
            font-size: 0.9rem; color: #555; background: #f8f9fa;
            padding: 10px; border-radius: 10px; border: 1px solid #eee;
        }

        .select-container { margin: 15px 0; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 0.9rem; }
        select {
            width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #ddd;
            font-size: 1rem; background-color: white; outline: none;
        }

        /* LINHA DE CADA REFEIÇÃO */
        .dynamic-schedule {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .meal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        /* ESTILO QUANDO JÁ FOI DADO (FED) */
        .meal-row.fed {
            background-color: #dcedc8; /* Verde Claro */
            border-color: #8bc34a;
            opacity: 0.8;
        }
        /* Risco na hora quando marcado */
        .meal-row.fed input[type="time"] {
            text-decoration: line-through;
            color: #558b2f;
            background-color: transparent;
            border: none;
        }

        .time-label { font-size: 0.8rem; font-weight: bold; color: #666; width: 30px; }
        
        input[type="time"] {
            font-family: 'Segoe UI', sans-serif; font-size: 1.2rem; padding: 5px;
            border: 1px solid #eee; border-radius: 6px; background: #f9f9f9; color: #333;
            width: 100px; text-align: center; font-weight: bold;
            outline: none;
        }

        /* CHECKBOX CUSTOMIZADO */
        .check-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .check-btn {
            width: 24px; height: 24px;
            cursor: pointer;
            accent-color: #2e7d32;
            transform: scale(1.3);
        }

        .status-bar {
            margin-top: 15px; padding: 10px; background: #333; color: white;
            border-radius: 8px; font-size: 0.9rem; font-weight: bold;
            min-height: 20px; /* Garante altura mesmo sem texto */
        }
        
        .btn-notify {
            margin-top: 15px; background: transparent; border: 1px solid #999; 
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; color: #555; cursor: pointer;
        }
        .btn-notify.active { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; }

        .footer { margin-top: 20px; font-size: 0.7rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Luffy Safety 🛡️</h1>
        <h4 style="margin-bottom: 10px;">Evite alimentação dupla!</h4>

        <div class="info-row">
            <span>Idade:</span> <strong id="idadeDisplay">--</strong>
        </div>
        <div class="info-row" style="margin-top:-5px;">
            <span>Meta Hoje:</span> <strong id="totalGrams">-- g</strong>
        </div>

        <div class="select-container">
            <select id="refeicoesSelect" onchange="resetarHorarios(true)">
                <option value="4" selected>4 Refeições (Ideal)</option>
                <option value="3">3 Refeições (Dias corridos)</option>
            </select>
        </div>

        <div style="text-align: left; margin-bottom: 5px; font-size: 0.8rem; color: #666;">
            Marque a caixinha ao alimentar:
        </div>
        
        <div id="clockContainer" class="dynamic-schedule"></div>

        <div id="statusBar" class="status-bar">Iniciando...</div>
        
        <button id="btnNotify" class="btn-notify" onclick="ativarNotificacoes()">🔔 Ativar Notificações</button>

        <div id="syncStatus" style="font-size: 0.7rem; color: #ccc; margin-top: 5px;"></div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const DATA_NASCIMENTO = new Date(2025, 9, 31); // 31/10/2025
        
        // ******************************************************
        // SEU PANTRY ID (Verifique se está correto)
        const PANTRY_ID = "c42cdca2-f5c9-4b78-b7ba-527236418398"; 
        // ******************************************************

        const BASKET_NAME = "LuffySchedule";
        const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

        window.onload = function() {
            // 1. Inicializa interface localmente (SEM ESPERAR INTERNET)
            // Isso evita o travamento na tela "Conectando"
            if(document.getElementById('clockContainer').innerHTML === "") {
                resetarHorarios(false); 
            }
            calcularDieta(); 
            verificarStatusVisual(); // Atualiza a barra preta imediatamente

            // 2. Busca dados da nuvem em segundo plano
            carregarDaNuvem(); 
            
            // 3. Loops de atualização
            setInterval(carregarDaNuvem, 5000); // Sincroniza a cada 5s
            setInterval(verificarStatusVisual, 60000); // Atualiza relógio local
            
            // Checar permissão de notificação
            if (Notification.permission === "granted") {
                const btn = document.getElementById('btnNotify');
                btn.innerText = "✅ Notificações Ativas";
                btn.classList.add('active');
            }
        };

        // --- LÓGICA DE NUVEM ---
        function salvarNaNuvem() {
            const inputsTime = document.querySelectorAll('input[type="time"]');
            const inputsCheck = document.querySelectorAll('input[type="checkbox"]');
            
            const horarios = Array.from(inputsTime).map(i => i.value);
            const checados = Array.from(inputsCheck).map(i => i.checked);
            const numRefeicoes = document.getElementById('refeicoesSelect').value;
            const hoje = new Date().toLocaleDateString(); 

            const dados = {
                data: hoje,
                modo: numRefeicoes,
                times: horarios,
                checks: checados, 
                autor: "AppUser"
            };
            
            document.getElementById('syncStatus').innerText = "Salvando...";
            
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
            .then(() => {
                document.getElementById('syncStatus').innerText = "Sincronizado";
                setTimeout(() => { document.getElementById('syncStatus').innerText = ""; }, 2000);
            })
            .catch(err => {
                console.error("Erro save", err);
                document.getElementById('syncStatus').innerText = "Offline (Tentando reconectar...)";
            });
        }

        function carregarDaNuvem() {
            fetch(API_URL)
            .then(res => res.json())
            .then(dados => {
                const hoje = new Date().toLocaleDateString();
                // Se os dados forem de hoje, aplica. Se for de ontem, ignora (mantém o reset local)
                if (dados.data === hoje) {
                    aplicarDados(dados);
                }
            })
            .catch(err => {
                console.log("Erro ao carregar ou gaveta vazia (primeiro uso)");
                // Não faz nada drástico, mantém a versão local funcionando
            });
        }

        function aplicarDados(dados) {
            // Se mudou o modo (3 ou 4 refeições) via nuvem
            const currentMode = document.getElementById('refeicoesSelect').value;
            if (currentMode !== dados.modo) {
                document.getElementById('refeicoesSelect').value = dados.modo;
                gerarInputsVisuais(parseInt(dados.modo));
                calcularDieta();
            }

            const inputsTime = document.querySelectorAll('input[type="time"]');
            const inputsCheck = document.querySelectorAll('input[type="checkbox"]');
            const rows = document.querySelectorAll('.meal-row');

            // Atualiza horários
            dados.times.forEach((time, i) => {
                if (inputsTime[i] && document.activeElement !== inputsTime[i] && inputsTime[i].value !== time) {
                    inputsTime[i].value = time;
                }
            });

            // Atualiza Checks e Cores
            if (dados.checks) {
                dados.checks.forEach((isChecked, i) => {
                    if (inputsCheck[i]) {
                        // Só atualiza se mudou o estado
                        if (inputsCheck[i].checked !== isChecked) {
                            inputsCheck[i].checked = isChecked;
                            if (isChecked) rows[i].classList.add('fed');
                            else rows[i].classList.remove('fed');
                        }
                    }
                });
            }
            // Chama a verificação visual para atualizar a barra preta
            verificarStatusVisual();
        }

        // --- INTERFACE ---
        function gerarInputsVisuais(numRefeicoes) {
            const container = document.getElementById('clockContainer');
            container.innerHTML = "";
            let intervalo = (numRefeicoes === 4) ? 4 : 6;

            for (let i = 0; i < numRefeicoes; i++) {
                let row = document.createElement('div');
                row.className = 'meal-row';
                
                let label = document.createElement('div');
                label.className = 'time-label';
                label.innerText = `#${i+1}`;
                
                let input = document.createElement('input');
                input.type = 'time';
                input.id = `time-${i}`;
                input.onchange = function() { 
                    recalcularCascata(i, numRefeicoes, intervalo);
                    salvarNaNuvem();
                };

                let checkContainer = document.createElement('div');
                checkContainer.className = 'check-container';
                let check = document.createElement('input');
                check.type = 'checkbox';
                check.className = 'check-btn';
                check.id = `check-${i}`;
                check.onchange = function() {
                    if(this.checked) row.classList.add('fed');
                    else row.classList.remove('fed');
                    salvarNaNuvem(); 
                    verificarStatusVisual(); // Atualiza barra preta imediatamente
                };

                checkContainer.appendChild(check);
                row.appendChild(label);
                row.appendChild(input);
                row.appendChild(checkContainer);
                container.appendChild(row);
            }
        }

        function resetarHorarios(isManualChange) {
            const numRefeicoes = parseInt(document.getElementById('refeicoesSelect').value);
            gerarInputsVisuais(numRefeicoes);

            let horaBase = 7; 
            let intervalo = (numRefeicoes === 4) ? 4 : 6;
            const inputs = document.querySelectorAll('input[type="time"]');

            inputs.forEach((input, i) => {
                let h = horaBase + (i * intervalo);
                if (h >= 24) h -= 24;
                input.value = `${h.toString().padStart(2, '0')}:00`;
            });

            calcularDieta();
            verificarStatusVisual(); // Garante que a barra mostre algo
            if (isManualChange) salvarNaNuvem();
        }

        function recalcularCascata(indexMudado, totalRefeicoes, intervalo) {
            let inputMudado = document.getElementById(`time-${indexMudado}`);
            if(!inputMudado.value) return;

            let [h, m] = inputMudado.value.split(':').map(Number);
            let minutosBase = (h * 60) + m;

            for (let i = indexMudado + 1; i < totalRefeicoes; i++) {
                let inputProximo = document.getElementById(`time-${i}`);
                minutosBase += (intervalo * 60);
                
                let novosMinutos = minutosBase % 1440;
                let novaHora = Math.floor(novosMinutos / 60);
                let novoMin = novosMinutos % 60;
                inputProximo.value = `${novaHora.toString().padStart(2, '0')}:${novoMin.toString().padStart(2, '0')}`;
            }
        }

        // --- LÓGICA DE STATUS E NOTIFICAÇÃO ---
        function ativarNotificacoes() {
            if (!("Notification" in window)) {
                alert("Este navegador não suporta notificações.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Luffy App", { body: "Notificações ativadas com sucesso!" });
                    document.getElementById('btnNotify').innerText = "✅ Notificações Ativas";
                    document.getElementById('btnNotify').classList.add('active');
                } else {
                    alert("Permissão negada. Verifique as configurações do navegador.");
                }
            });
        }

        function verificarStatusVisual() {
            const inputsTime = document.querySelectorAll('input[type="time"]');
            const inputsCheck = document.querySelectorAll('input[type="checkbox"]');
            
            const agora = new Date();
            const minutosAgora = (agora.getHours() * 60) + agora.getMinutes();
            let proximaIndex = -1;
            let encontrouProxima = false;
            let tudoComido = true;

            // Encontra a próxima refeição pendente
            inputsTime.forEach((input, i) => {
                if (!inputsCheck[i].checked) {
                    tudoComido = false;
                    if (!encontrouProxima) {
                        let [h, m] = input.value.split(':').map(Number);
                        let minutosRef = (h * 60) + m;
                        // Considera próxima se ainda não passou 60 min do horário
                        if (minutosAgora < minutosRef + 60) {
                            proximaIndex = i;
                            encontrouProxima = true;
                        }
                    }
                }
            });

            const statusBar = document.getElementById('statusBar');
            
            if (tudoComido) {
                document.body.classList.remove('feeding-time');
                statusBar.innerText = "✅ Dia concluído! Luffy alimentado.";
                return;
            }

            if (proximaIndex !== -1) {
                const horaProx = inputsTime[proximaIndex].value;
                let [h, m] = horaProx.split(':').map(Number);
                let minutosRef = (h * 60) + m;
                
                // Janela de Alimentação (-15 min até +30 min)
                if (minutosAgora >= (minutosRef - 15) && minutosAgora <= (minutosRef + 30)) {
                    document.body.classList.add('feeding-time');
                    statusBar.innerText = `🍖 HORA DE COMER! (${horaProx})`;
                    tocarNotificacao(`Hora da refeição (${horaProx})!`);
                } else {
                    document.body.classList.remove('feeding-time');
                    // Calcula tempo restante
                    let diff = minutosRef - minutosAgora;
                    if (diff < 0) diff += 1440;
                    
                    let horasFalta = Math.floor(diff / 60);
                    let minFalta = diff % 60;
                    
                    if (horasFalta > 0) statusBar.innerText = `⏳ Próxima: ${horaProx} (falta ${horasFalta}h ${minFalta}m)`;
                    else statusBar.innerText = `⏳ Próxima: ${horaProx} (falta ${minFalta} min)`;
                }
            } else {
                statusBar.innerText = "Aguardando próximo dia...";
            }
        }

        function tocarNotificacao(texto) {
            if (Notification.permission !== "granted") return;
            const agora = new Date();
            const chave = `notif-${agora.getDate()}-${agora.getHours()}`;
            if (sessionStorage.getItem(chave)) return; // Evita repetição na mesma hora

            try {
                new Notification("Luffy App", { 
                    body: texto,
                    icon: "https://cdn-icons-png.flaticon.com/512/616/616408.png"
                });
                sessionStorage.setItem(chave, "true");
            } catch(e) { console.log(e); }
        }

        // --- CÁLCULO DIETA ---
        function calcularDieta() {
            const hoje = new Date();
            hoje.setHours(0,0,0,0); 
            let meses = (hoje.getFullYear() - DATA_NASCIMENTO.getFullYear()) * 12;
            meses -= DATA_NASCIMENTO.getMonth();
            meses += hoje.getMonth();
            let diasExtras = hoje.getDate() - DATA_NASCIMENTO.getDate();
            if (diasExtras < 0) {
                meses--;
                let ultimoDiaMesAnterior = new Date(hoje.getFullYear(), hoje.getMonth(), 0).getDate();
                diasExtras += ultimoDiaMesAnterior;
            }
            document.getElementById('idadeDisplay').innerText = `${meses} meses, ${diasExtras} dias`;

            const tabela = { 2: 442, 3: 584, 4: 695, 5: 808, 6: 920, 7: 930, 8: 900 };
            let totalDiario = 0;
            if (meses < 2) totalDiario = 350 + (diasExtras * 3); 
            else if (meses >= 8) totalDiario = 900;
            else {
                const baseAtual = tabela[meses];
                const baseProxima = tabela[meses + 1] || baseAtual;
                totalDiario = baseAtual + ((baseProxima - baseAtual) / 30 * diasExtras);
            }
            const numRefeicoes = parseInt(document.getElementById('refeicoesSelect').value);
            const totalFinal = Math.round(totalDiario);
            document.getElementById('totalGrams').innerText = totalFinal + " g";
        }
    </script>

</body>
</html>
